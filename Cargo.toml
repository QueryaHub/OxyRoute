[package]
name = "oxyroute"
version = "0.1.0"
edition = "2021"
description = "RSGI web framework: Rust hot path, Python handlers"

[lib]
name = "_oxyroute"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py310", "extension-module", "auto-initialize"] }
pyo3-asyncio-0-21 = { version = "0.21", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
matchit = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
jsonwebtoken = "9"
base64 = "0.22"
once_cell = "1.19"
# RFC 1738 / WHATWG: percent-decode and + as space in application/x-www-form-urlencoded query
form_urlencoded = "1.2"

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
