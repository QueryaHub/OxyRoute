[package]
name = "oxyroute"
version = "0.4.0"
edition = "2021"
description = "RSGI web framework: Rust hot path, Python handlers"
license = "MIT"
repository = "https://github.com/QueryaHub/OxyRoute"

[lib]
name = "_oxyroute"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py310", "extension-module", "auto-initialize", "py-clone"] }
pyo3-async-runtimes = { version = "0.25", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
matchit = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
jsonwebtoken = "9"
base64 = "0.22"
once_cell = "1.19"
# RFC 1738 / WHATWG: percent-decode and + as space in application/x-www-form-urlencoded query
form_urlencoded = "1.2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
multer = "3.1"
log = "0.4"
parking_lot = "0.12"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "sqlite", "tls-rustls"] }

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
