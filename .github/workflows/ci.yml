name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest oxyjwt httpx
      - name: Build and install oxyroute
        run: |
          maturin build --release
          python -m pip install target/wheels/oxyroute-*.whl
      - name: Pytest (isolated dir so repo tree does not shadow the installed package)
        run: |
          cd "$(mktemp -d)"
          python -m pytest "$GITHUB_WORKSPACE/tests" -v
